name: inception

services:
  mariadb:
    build:
      context: requirements/mariadb/.
      dockerfile: Dockerfile
    container_name: mariadb
    healthcheck:
      test: 
        - CMD-SHELL
        - mariadb-admin ping -h localhost -P "$$DB_PORT" -u root -p"$$(cat /run/secrets/db_root_password)" --silent
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    secrets:
      - db_root_password
      - db_user_password
      - db_user
    environment:
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
    volumes:
      - type: volume
        source: maria_db
        target: /var/lib/mysql
    networks:
      - inception
    restart: on-failure

  wordpress:
    depends_on:
      mariadb:
        condition: service_healthy
    build:
      context: requirements/wordpress/.
      dockerfile: Dockerfile
    container_name: wordpress
    healthcheck:
      test:
       - CMD-SHELL
       - nc -z 127.0.0.1 ${WP_PORT} || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    secrets:
      - db_user
      - db_user_password
      - wp_admin_password
      - wp_admin_name
      - wp_admin_email
      - wp_user_password
      - wp_user
      - wp_user_email
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_NAME=${DB_NAME}
      - WP_TITLE=${WP_TITLE}
      - WP_PORT=${WP_PORT}
      - DB_PORT=${DB_PORT}
      - NGINX_PORT=${NGINX_PORT}
    volumes:
      - type: volume
        source: wp_data
        target: /var/www/html
    networks:
      - inception
    restart: on-failure

  nginx:
    depends_on:
      wordpress:
        condition: service_healthy
    build: 
      context: requirements/nginx/.
      dockerfile: Dockerfile
    container_name: nginx
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - WP_PORT=${WP_PORT}
    ports:
      - "${NGINX_PORT}:443"
    volumes:
      - type: volume
        source: wp_data
        target: /var/www/html
      - type: volume
        source: nginx_data
        target: /etc/nginx/ssl
    networks:
      - inception
    restart: on-failure



# ================= Networks =================
networks:
  inception:
    driver: bridge

# ================= Volumes =================
volumes:
  wp_data:
    name: wp_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/html/

  nginx_data:
    name: nginx_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/nginx/
    
  maria_db:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb/

# ================= Secrets =================
secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_user_password:
    file: ../secrets/db_user_password.txt
  db_user:
    file: ../secrets/db_user.txt
  
  wp_admin_email:
    file: ../secrets/wp_admin_email.txt
  wp_user_email:
    file: ../secrets/wp_user_email.txt
  wp_user:
    file: ../secrets/wp_user.txt
  wp_admin_name:
    file: ../secrets/wp_admin_name.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt